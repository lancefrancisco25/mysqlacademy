<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1311" />
      <stop offset="100%" stop-color="#060908" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Subtle ambient glow circle -->
  <circle cx="32" cy="32" r="22" fill="url(#glowGrad)" />

  <!-- Database Icon Cylinders -->
  <g transform="translate(10, 10) scale(1.83)" filter="url(#glow)">
    <!-- Top Cylinder Cap -->
    <ellipse cx="12" cy="5" rx="9" ry="3.2" fill="#10b981" fill-opacity="0.2" stroke="url(#emeraldGrad)" stroke-width="1.8" />
    <ellipse cx="12" cy="5" rx="5" ry="1.6" fill="#34d399" fill-opacity="0.3" />

    <!-- Outer Cylinder Body -->
    <path d="M3 5v14c0 1.77 4.03 3.2 9 3.2s9-1.43 9-3.2V5" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Middle Cylinder Ring 1 -->
    <path d="M3 12c0 1.77 4.03 3.2 9 3.2s9-1.43 9-3.2" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
